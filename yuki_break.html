<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>有機ブレイク！ - 受験生のための有機化学ゲーム</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --success: #34d399;
    --danger: #f87171;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  .header {
    text-align: center;
    padding: 12px 0 8px;
  }
  .logo {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  /* Stats bar */
  .stats {
    display: flex;
    justify-content: space-between;
    background: rgba(30,41,59,0.8);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 0.85rem;
    border: 1px solid rgba(148,163,184,0.15);
  }
  .stat-item { text-align: center; }
  .stat-value { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--muted); }
  /* Screens */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  /* Menu */
  .menu-btn {
    background: var(--card);
    border: 1px solid rgba(148,163,184,0.2);
    border-radius: 16px;
    padding: 18px 20px;
    margin: 8px 0;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
  }
  .menu-btn:hover, .menu-btn:active {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(56,189,248,0.15);
  }
  .menu-btn .icon { font-size: 1.6rem; }
  .menu-btn .desc { font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
  /* Category grid */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .cat-btn {
    background: var(--card);
    border: 1px solid rgba(148,163,184,0.2);
    border-radius: 14px;
    padding: 16px 10px;
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .cat-btn:hover { border-color: var(--accent2); }
  /* Question */
  .q-card {
    background: var(--card);
    border-radius: 20px;
    padding: 22px 18px;
    margin: 12px 0;
    border: 1px solid rgba(148,163,184,0.15);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .q-category {
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 1.05rem;
    line-height: 1.55;
    margin-bottom: 16px;
    flex: 1;
  }
  .formula {
    font-family: "Courier New", monospace;
    background: rgba(15,23,42,0.6);
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-block;
    margin: 6px 0;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt-btn {
    background: rgba(15,23,42,0.7);
    border: 2px solid rgba(148,163,184,0.25);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(56,189,248,0.1);
  }
  .opt-btn.correct {
    border-color: var(--success);
    background: rgba(52,211,153,0.15);
  }
  .opt-btn.wrong {
    border-color: var(--danger);
    background: rgba(248,113,113,0.15);
  }
  .opt-btn:disabled { cursor: default; opacity: 0.85; }
  /* Feedback */
  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); }
  .feedback.wrong { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); }
  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #0f172a;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid rgba(148,163,184,0.3);
  }
  /* Result */
  .result-box {
    text-align: center;
    padding: 30px 20px;
  }
  .result-score {
    font-size: 3.5rem;
    font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .rank {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 10px 0;
    color: var(--accent2);
  }
  .combo-max {
    color: var(--muted);
    font-size: 0.9rem;
  }
  /* Timer */
  .timer-bar {
    height: 6px;
    background: rgba(148,163,184,0.2);
    border-radius: 3px;
    margin: 8px 0 4px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    width: 100%;
    transition: width 0.1s linear;
  }
  /* Footer */
  .footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    padding: 12px 0 4px;
  }
  /* Animations */
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.25s ease-out; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.3s; }
  /* Confetti simple */
  .confetti {
    position: fixed;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">有機ブレイク！</div>
    <div class="subtitle">休憩時間に強くなる有機化学</div>
  </div>

  <!-- MENU -->
  <div id="menu" class="screen active">
    <div class="stats" id="menuStats">
      <div class="stat-item">
        <div class="stat-value" id="highScore">0</div>
        <div class="stat-label">ハイスコア</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalPlayed">0</div>
        <div class="stat-label">総プレイ</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="bestCombo">0</div>
        <div class="stat-label">最高コンボ</div>
      </div>
    </div>

    <button class="menu-btn" onclick="startMode('normal')">
      <span class="icon">🧪</span>
      <div>
        <div>クイズモード</div>
        <div class="desc">10問で実力チェック</div>
      </div>
    </button>
    <button class="menu-btn" onclick="startMode('timeattack')">
      <span class="icon">⏱️</span>
      <div>
        <div>休憩タイムアタック</div>
        <div class="desc">3分間で何問解ける？</div>
      </div>
    </button>
    <button class="menu-btn" onclick="showCategories()">
      <span class="icon">📚</span>
      <div>
        <div>カテゴリー練習</div>
        <div class="desc">苦手分野を徹底攻略</div>
      </div>
    </button>

    <div id="categorySelect" style="display:none;">
      <div class="cat-grid">
        <button class="cat-btn" onclick="startMode('category','官能基')">官能基</button>
        <button class="cat-btn" onclick="startMode('category','命名法')">命名法</button>
        <button class="cat-btn" onclick="startMode('category','反応')">反応</button>
        <button class="cat-btn" onclick="startMode('category','異性体')">異性体</button>
        <button class="cat-btn" onclick="startMode('category','構造決定')">構造決定</button>
        <button class="cat-btn" onclick="startMode('category','芳香族')">芳香族</button>
      </div>
      <button class="btn btn-secondary" style="margin-top:14px;width:100%;" onclick="hideCategories()">戻る</button>
    </div>

    <div class="footer">本気で作った受験生応援ゲーム</div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen">
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="score">0</div>
        <div class="stat-label">スコア</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="combo">0</div>
        <div class="stat-label">コンボ</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="qNum">1</div>
        <div class="stat-label">問題</div>
      </div>
    </div>
    <div class="timer-bar" id="timerBar" style="display:none;">
      <div class="timer-fill" id="timerFill"></div>
    </div>
    <div class="q-card pop" id="qCard">
      <div class="q-category" id="qCat"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="controls">
      <button class="btn btn-secondary" onclick="backToMenu()">やめる</button>
      <button class="btn btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">次へ →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-box">
      <div style="font-size:0.9rem;color:var(--muted);">結果発表</div>
      <div class="result-score" id="finalScore">0</div>
      <div class="rank" id="rankText">有機マスター</div>
      <div class="combo-max" id="resultDetail"></div>
      <div style="margin-top:24px;">
        <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="restart()">もう一回！</button>
        <button class="btn btn-secondary" style="width:100%;" onclick="backToMenu()">メニューへ</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===================== DATA =====================
const QUESTIONS = [
  // 官能基
  {cat:"官能基", q:"次の構造が持つ官能基はどれ？\n<span class='formula'>CH₃–CH₂–COOH</span>", opts:["カルボン酸","ケトン","アルデヒド","アルコール"], ans:0, exp:"末端に –COOH があるのでカルボン酸（酢酸の同族体）。"},
  {cat:"官能基", q:"次の化合物の官能基は？\n<span class='formula'>CH₃–CO–CH₃</span>", opts:["アルデヒド","ケトン","カルボン酸","エステル"], ans:1, exp:"カルボニル基が炭素鎖の途中にあるのでケトン（アセトン）。"},
  {cat:"官能基", q:"次の構造の主な官能基は？\n<span class='formula'>CH₃–CH₂–CHO</span>", opts:["ケトン","カルボン酸","アルデヒド","エーテル"], ans:2, exp:"末端に –CHO があるのでアルデヒド（プロパナール）。"},
  {cat:"官能基", q:"フェノールの官能基は？", opts:["ヒドロキシ基（芳香族）","カルボキシ基","アミノ基","ニトロ基"], ans:0, exp:"ベンゼン環に直接結合した –OH がフェノール性ヒドロキシ基。"},
  {cat:"官能基", q:"次の構造の官能基は？\n<span class='formula'>CH₃–COO–CH₂–CH₃</span>", opts:["エーテル","エステル","カルボン酸","ケトン"], ans:1, exp:"–COO– の形なのでエステル（酢酸エチル）。"},
  {cat:"官能基", q:"アニリンの官能基は？", opts:["ヒドロキシ基","アミノ基","カルボキシ基","スルホ基"], ans:1, exp:"ベンゼン環に –NH₂ が直接ついたものがアニリン。"},
  {cat:"官能基", q:"次の化合物の官能基は？\n<span class='formula'>CH₃–O–CH₃</span>", opts:["アルコール","エーテル","ケトン","アルデヒド"], ans:1, exp:"酸素が2つの炭素に挟まれているのでエーテル。"},
  {cat:"官能基", q:"サリチル酸が持つ2つの官能基は？", opts:["–COOH と –OH","–CHO と –OH","–COOH と –NH₂","–COOR と –OH"], ans:0, exp:"サリチル酸は o-ヒドロキシ安息香酸。カルボキシ基とフェノール性ヒドロキシ基を持つ。"},

  // 命名法
  {cat:"命名法", q:"次の化合物のIUPAC名は？\n<span class='formula'>CH₃–CH₂–CH₂–OH</span>", opts:["1-プロパノール","2-プロパノール","エタノール","プロパン酸"], ans:0, exp:"直鎖3炭素の第一級アルコールなので1-プロパノール。"},
  {cat:"命名法", q:"次の構造の正しい名称は？\n<span class='formula'>CH₃–CH(OH)–CH₃</span>", opts:["1-プロパノール","2-プロパノール","プロパナール","アセトン"], ans:1, exp:"ヒドロキシ基が2位にある第二級アルコール → 2-プロパノール。"},
  {cat:"命名法", q:"酢酸のIUPAC名は？", opts:["メタノール","エタン酸","プロパン酸","メタナール"], ans:1, exp:"炭素2つのカルボン酸なのでエタン酸。慣用名が酢酸。"},
  {cat:"命名法", q:"次の化合物名は？\n<span class='formula'>CH₃–CH₂–CHO</span>", opts:["プロパナール","プロパノン","プロパン酸","プロペン"], ans:0, exp:"末端アルデヒド・炭素3つ → プロパナール。"},
  {cat:"命名法", q:"アセトンのIUPAC名は？", opts:["プロパナール","プロパン-2-オン","ブタノン","エタン酸"], ans:1, exp:"炭素3つのケトンでカルボニルが2位 → プロパン-2-オン。"},
  {cat:"命名法", q:"次の構造の名称として正しいのは？\n<span class='formula'>CH₂=CH–CH₃</span>", opts:["プロパン","プロペン","プロピン","シクロプロパン"], ans:1, exp:"二重結合を持つ炭素3つのアルケン → プロペン。"},
  {cat:"命名法", q:"官能基の優先順位で最も高いものは？", opts:["–OH","–COOH","–CHO","–NH₂"], ans:1, exp:"高校レベルではカルボン酸（–COOH）が最優先。"},
  {cat:"命名法", q:"次の化合物の正しい番号付けは？\n<span class='formula'>CH₃–CH₂–CH(OH)–CH₃</span>", opts:["1-ブタノール","2-ブタノール","3-ブタノール","ブタン-1-オール"], ans:1, exp:"ヒドロキシ基の位置番号が小さくなるように番号を振る → 2-ブタノール。"},

  // 反応
  {cat:"反応", q:"第一級アルコールを酸化すると最終的に何になる？", opts:["ケトン","カルボン酸","エーテル","アルケン"], ans:1, exp:"1級アルコール → アルデヒド → カルボン酸。"},
  {cat:"反応", q:"第二級アルコールを酸化すると何になる？", opts:["カルボン酸","ケトン","アルデヒド","アルケン"], ans:1, exp:"2級アルコールは酸化されてケトンになる。3級は酸化されにくい。"},
  {cat:"反応", q:"アルケンに臭素を付加させるとどうなる？", opts:["二重結合が消えジブロモ体になる","何も起きない","ポリマーになる","酸化される"], ans:0, exp:"求電子付加反応でBr₂が付加し、二重結合が消える（脱色）。"},
  {cat:"反応", q:"エタノールを濃硫酸と加熱（約170℃）すると主な生成物は？", opts:["ジエチルエーテル","エチレン","酢酸","アセトアルデヒド"], ans:1, exp:"高温では分子内脱水が優先しエチレンが生成。低温ではエーテル。"},
  {cat:"反応", q:"カルボン酸とアルコールの反応を何という？", opts:["けん化","エステル化","付加反応","酸化"], ans:1, exp:"濃硫酸触媒下でカルボン酸＋アルコール → エステル＋水（エステル化）。"},
  {cat:"反応", q:"ヨードホルム反応を示す構造はどれ？", opts:["CH₃–CH₂–","CH₃–CO– または CH₃–CH(OH)–","–COOH","ベンゼン環"], ans:1, exp:"CH₃CO– または CH₃CH(OH)– 構造を持つものがヨードホルム反応陽性。"},
  {cat:"反応", q:"銀鏡反応が陽性になる主な官能基は？", opts:["ケトン","アルデヒド","カルボン酸","アルコール"], ans:1, exp:"アルデヒド基が銀鏡反応（Tollens試薬）で陽性。"},
  {cat:"反応", q:"アセチレンに水を付加（Hg²⁺触媒）すると何が生成？", opts:["エチレン","アセトアルデヒド","酢酸","エタノール"], ans:1, exp:"HC≡CH + H₂O → CH₃CHO（アセトアルデヒド）。"},
  {cat:"反応", q:"油脂のけん化で得られるものは？", opts:["セッケンとグリセリン","エステルと水","カルボン酸とアルコール","アルケン"], ans:0, exp:"油脂＋NaOH → 高級脂肪酸のナトリウム塩（セッケン）＋グリセリン。"},

  // 異性体
  {cat:"異性体", q:"分子式が同じで構造が異なる化合物を何という？", opts:["同位体","異性体","同素体","誘導体"], ans:1, exp:"分子式同一・構造異なるものが異性体。"},
  {cat:"異性体", q:"構造異性体と立体異性体の違いは？", opts:["結合の仕方 vs 空間配置","炭素数 vs 水素数","沸点 vs 融点","極性 vs 無極性"], ans:0, exp:"構造異性体は結合様式が違う。立体異性体は結合は同じで空間的配置が違う。"},
  {cat:"異性体", q:"シス-トランス異性体が存在する条件は？", opts:["二重結合の両端に異なる基","三重結合がある","環がない","光学活性がある"], ans:0, exp:"C=C の各炭素に異なる置換基があり、回転が制限されている場合。"},
  {cat:"異性体", q:"光学異性体が存在する主な原因は？", opts:["不斉炭素原子","二重結合","三重結合","芳香環"], ans:0, exp:"不斉炭素（4つの異なる置換基がついた炭素）があると鏡像異性体が存在。"},
  {cat:"異性体", q:"分子式 C₄H₁₀ のアルカンの構造異性体は何種類？", opts:["1","2","3","4"], ans:1, exp:"n-ブタンとイソブタン（2-メチルプロパン）の2種類。"},
  {cat:"異性体", q:"分子式 C₄H₁₀O のアルコールの構造異性体は何種類？（立体除く）", opts:["2","3","4","5"], ans:2, exp:"1-ブタノール、2-ブタノール、2-メチル-1-プロパノール、2-メチル-2-プロパノールの4つ。"},
  {cat:"異性体", q:"フマル酸とマレイン酸の関係は？", opts:["構造異性体","幾何異性体","光学異性体","同素体"], ans:1, exp:"シス（マレイン酸）とトランス（フマル酸）の幾何異性体。"},
  {cat:"異性体", q:"乳酸が光学異性体を持つ理由は？", opts:["不斉炭素があるから","二重結合があるから","環状だから","カルボキシ基があるから"], ans:0, exp:"中央の炭素が4つの異なる基（–H, –OH, –CH₃, –COOH）と結合している。"},

  // 構造決定
  {cat:"構造決定", q:"不飽和度の計算式は？", opts:["(2C+2+N–H–X)/2","(C+H)/2","2C+2–H","C–H+1"], ans:0, exp:"不飽和度 = (2×C数 + 2 + N数 − H数 − ハロゲン数) ÷ 2。酸素は数えない。"},

  {cat:"構造決定", q:"分子式 C₂H₄O₂ で酸性を示す化合物は？", opts:["ギ酸メチル","酢酸","エチレングリコール","アセトアルデヒド"], ans:1, exp:"酢酸（CH₃COOH）。ギ酸メチルはエステルで中性。"},

  // 芳香族
  {cat:"芳香族", q:"ベンゼンにメチル基がついた化合物は？", opts:["フェノール","トルエン","アニリン","スチレン"], ans:1, exp:"トルエン（メチルベンゼン）。"},
  {cat:"芳香族", q:"フェノールに希硝酸を作用させると生成する主なものは？", opts:["ピクリン酸","ニトロベンゼン","アニリン","サリチル酸"], ans:0, exp:"フェノールはニトロ化されやすく、最終的に2,4,6-トリニトロフェノール（ピクリン酸）になる。"},
  {cat:"芳香族", q:"アニリンをさらし粉で酸化すると何色になる？", opts:["赤紫色","青色","黄色","無色"], ans:0, exp:"アニリンの検出反応。さらし粉で赤紫色。"},
  {cat:"芳香族", q:"サリチル酸と無水酢酸を反応させると得られる医薬品は？", opts:["アセトアニリド","アスピリン","フェナセチン","パラセタモール"], ans:1, exp:"アセチルサリチル酸（アスピリン）。"},
  {cat:"芳香族", q:"ベンゼンの求電子置換反応でオルト・パラ配向性の基は？", opts:["–NO₂","–COOH","–OH","–SO₃H"], ans:2, exp:"–OH, –NH₂, –CH₃ などは電子供与性でオルト・パラ配向。"},
  {cat:"芳香族", q:"トルエンを酸化すると何が生成する？", opts:["フェノール","安息香酸","ベンズアルデヒドのみ","ベンゼン"], ans:1, exp:"側鎖が酸化されて安息香酸になる。"},
];

// ===================== STATE =====================
let state = {
  mode: null,
  category: null,
  queue: [],
  current: 0,
  score: 0,
  combo: 0,
  maxCombo: 0,
  answered: false,
  timer: null,
  timeLeft: 180,
  totalQ: 0
};

// ===================== STORAGE =====================
function loadStats() {
  const hs = localStorage.getItem('yuki_hs') || 0;
  const tp = localStorage.getItem('yuki_tp') || 0;
  const bc = localStorage.getItem('yuki_bc') || 0;
  document.getElementById('highScore').textContent = hs;
  document.getElementById('totalPlayed').textContent = tp;
  document.getElementById('bestCombo').textContent = bc;
}
function saveStats(score, combo) {
  const hs = Math.max(score, +(localStorage.getItem('yuki_hs')||0));
  const tp = +(localStorage.getItem('yuki_tp')||0) + 1;
  const bc = Math.max(combo, +(localStorage.getItem('yuki_bc')||0));
  localStorage.setItem('yuki_hs', hs);
  localStorage.setItem('yuki_tp', tp);
  localStorage.setItem('yuki_bc', bc);
}

// ===================== UI HELPERS =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showCategories() {
  document.getElementById('categorySelect').style.display = 'block';
}
function hideCategories() {
  document.getElementById('categorySelect').style.display = 'none';
}

// ===================== GAME LOGIC =====================
function startMode(mode, cat = null) {
  state.mode = mode;
  state.category = cat;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.current = 0;
  state.answered = false;
  state.timeLeft = 180;

  // Build queue
  let pool = QUESTIONS;
  if (mode === 'category' && cat) {
    pool = QUESTIONS.filter(q => q.cat === cat);
  }
  // Shuffle
  state.queue = [...pool].sort(() => Math.random() - 0.5);
  if (mode === 'normal') {
    state.queue = state.queue.slice(0, 10);
  }
  state.totalQ = state.queue.length;

  // Timer UI
  const bar = document.getElementById('timerBar');
  if (mode === 'timeattack') {
    bar.style.display = 'block';
    startTimer();
  } else {
    bar.style.display = 'none';
    if (state.timer) clearInterval(state.timer);
  }

  updateStatsUI();
  showScreen('game');
  renderQuestion();
}

function startTimer() {
  if (state.timer) clearInterval(state.timer);
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';
  state.timer = setInterval(() => {
    state.timeLeft -= 0.1;
    const pct = Math.max(0, (state.timeLeft / 180) * 100);
    fill.style.width = pct + '%';
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      endGame();
    }
  }, 100);
}

function updateStatsUI() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('combo').textContent = state.combo;
  document.getElementById('qNum').textContent = (state.current + 1) + (state.mode === 'timeattack' ? '' : '/' + state.totalQ);
}

function renderQuestion() {
  if (state.current >= state.queue.length) {
    if (state.mode === 'timeattack') {
      // reshuffle for endless
      state.queue = [...QUESTIONS].sort(() => Math.random() - 0.5);
      state.current = 0;
    } else {
      endGame();
      return;
    }
  }

  const q = state.queue[state.current];
  state.answered = false;
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').style.display = 'none';

  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qText').innerHTML = q.q.replace(/\n/g, '<br>');

  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optsEl.appendChild(btn);
  });

  document.getElementById('qCard').classList.remove('pop');
  void document.getElementById('qCard').offsetWidth;
  document.getElementById('qCard').classList.add('pop');
  updateStatsUI();
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.answered = true;

  const q = state.queue[state.current];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  if (idx === q.ans) {
    btns[idx].classList.add('correct');
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const points = 100 + (state.combo - 1) * 20;
    state.score += points;
    fb.className = 'feedback correct show';
    fb.innerHTML = `✅ 正解！ +${points}点<br><small>${q.exp}</small>`;
    playTone(880, 0.08);
  } else {
    btns[idx].classList.add('wrong');
    btns[q.ans].classList.add('correct');
    state.combo = 0;
    fb.className = 'feedback wrong show';
    fb.innerHTML = `❌ 不正解<br><small>${q.exp}</small>`;
    document.getElementById('qCard').classList.add('shake');
    setTimeout(() => document.getElementById('qCard').classList.remove('shake'), 300);
    playTone(220, 0.15);
  }
  updateStatsUI();
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  state.current++;
  renderQuestion();
}

function endGame() {
  if (state.timer) clearInterval(state.timer);
  saveStats(state.score, state.maxCombo);
  loadStats();

  document.getElementById('finalScore').textContent = state.score;
  let rank = '有機ビギナー';
  if (state.score >= 1200) rank = '有機マスター 🏆';
  else if (state.score >= 800) rank = '有機上級者';
  else if (state.score >= 500) rank = '有機中級者';
  else if (state.score >= 300) rank = '有機初級者';
  document.getElementById('rankText').textContent = rank;
  document.getElementById('resultDetail').textContent =
    `最高コンボ ${state.maxCombo} ／ 正解を重ねてコンボを伸ばそう！`;
  showScreen('result');
}

function restart() {
  startMode(state.mode, state.category);
}

function backToMenu() {
  if (state.timer) clearInterval(state.timer);
  hideCategories();
  loadStats();
  showScreen('menu');
}

// Simple sound
function playTone(freq, dur) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

// Init
loadStats();
</script>
