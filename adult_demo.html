<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜の選択 — Adult Demo</title>
<style>
  :root {
    --bg: #0c0a09;
    --card: #1c1917;
    --accent: #f43f5e;
    --accent2: #fb7185;
    --text: #fafaf9;
    --muted: #a8a29e;
    --soft: #44403c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #1c1917 0%, #0c0a09 70%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Title */
  .title-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 24px;
  }
  .logo {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #f43f5e, #fb7185, #fda4af);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .start-btn {
    margin-top: 20px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    border: none;
    border-radius: 50px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35);
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(244, 63, 94, 0.45);
  }
  /* Game UI */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  .status-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .stat-bar {
    height: 6px;
    background: var(--soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .fill-affection { background: linear-gradient(90deg, #fb7185, #f43f5e); }
  .fill-arousal { background: linear-gradient(90deg, #f97316, #ef4444); }
  .stat-value {
    font-size: 0.75rem;
    color: var(--text);
    margin-top: 3px;
    text-align: right;
  }
  .scene-card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    border: 1px solid rgba(255,255,255,0.06);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .scene-text {
    font-size: 1.02rem;
    line-height: 1.75;
    white-space: pre-wrap;
    flex: 1;
  }
  .scene-text .name {
    color: var(--accent2);
    font-weight: 600;
  }
  .choices {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice-btn {
    background: rgba(28, 25, 23, 0.8);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }
  .choice-btn:hover {
    border-color: var(--accent);
    background: rgba(244, 63, 94, 0.1);
    transform: translateX(4px);
  }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 12px;
    text-align: center;
  }
  /* Ending */
  .ending {
    text-align: center;
    padding: 40px 20px;
  }
  .ending-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 16px;
  }
  .ending-text {
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 28px;
    color: #e7e5e4;
  }
  .restart-btn {
    padding: 14px 40px;
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    border: none;
    border-radius: 50px;
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Title -->
  <div id="title" class="screen active">
    <div class="title-screen">
      <div class="logo">夜の選択</div>
      <div class="tagline">短い大人のインタラクティブデモ</div>
      <button class="start-btn" onclick="startGame()">はじめる</button>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:8px;">
        18歳以上向け / 選択肢で展開が変わります
      </div>
    </div>
  </div>

  <!-- Game -->
  <div id="game" class="screen">
    <div class="status-bar">
      <div class="stat">
        <div class="stat-label">好感度</div>
        <div class="stat-bar"><div class="stat-fill fill-affection" id="affBar" style="width:20%"></div></div>
        <div class="stat-value" id="affVal">20</div>
      </div>
      <div class="stat">
        <div class="stat-label">興奮度</div>
        <div class="stat-bar"><div class="stat-fill fill-arousal" id="aroBar" style="width:10%"></div></div>
        <div class="stat-value" id="aroVal">10</div>
      </div>
    </div>
    <div class="scene-card">
      <div class="scene-text" id="sceneText"></div>
      <div class="choices" id="choices"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <!-- Ending -->
  <div id="ending" class="screen">
    <div class="ending">
      <div class="ending-title" id="endTitle"></div>
      <div class="ending-text" id="endText"></div>
      <button class="restart-btn" onclick="restart()">もう一度</button>
    </div>
  </div>
</div>

<script>

    choices: [
      { text: "ゆっくりと結合する", next: "gentle", aff: 30, aro: 40 },
      { text: "彼女の言葉に応え、一気に深く入れる", next: "intense", aff: 20, aro: 50 }

    text: `ベッドに押し倒し、彼女の両腕を頭上で押さえる。\n抵抗するどころか、彼女は脚を絡めてきた。\n\n「……乱暴な人」\n\n瞳は笑っている。下半身を密着させると、熱い感触が伝わってくる。\nすでに準備はできているらしい。\n\n「焦らさないで……欲しいの」`,

    isEnd: true,

let state = {
  affection: 20,
  arousal: 10,
  current: "start"
};

function startGame() {
  state = { affection: 20, arousal: 10, current: "start" };
  updateStats();
  showScreen("game");
  renderScene("start");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function updateStats() {
  state.affection = Math.max(0, Math.min(100, state.affection));
  state.arousal = Math.max(0, Math.min(100, state.arousal));
  document.getElementById("affBar").style.width = state.affection + "%";
  document.getElementById("aroBar").style.width = state.arousal + "%";
  document.getElementById("affVal").textContent = state.affection;
  document.getElementById("aroVal").textContent = state.arousal;
}

function renderScene(id) {
  const scene = scenes[id];
  if (!scene) return;

  if (scene.isEnd) {
    document.getElementById("endTitle").textContent = scene.title;
    document.getElementById("endText").textContent = scene.text;
    showScreen("ending");
    return;
  }

  state.current = id;
  document.getElementById("sceneText").textContent = scene.text;

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  scene.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.text;
    btn.onclick = () => choose(c);
    choicesEl.appendChild(btn);
  });

  document.getElementById("hint").textContent = "";
}

function choose(choice) {
  state.affection += choice.aff || 0;
  state.arousal += choice.aro || 0;
  updateStats();
  renderScene(choice.next);
}

function restart() {
  showScreen("title");
}
</script>
</body>
</html>
